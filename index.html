  <script>/* start the data the first view needs at once, in parallel with the stylesheets and scripts, instead of after
    them (owner, 2026-10-20: first visits were slow). Each preload matches the page's own fetch, so nothing loads twice. */
  (function(){try{var d=document,h=(location.hash||'').slice(1).split('?')[0]||'home',zh=false;try{zh=localStorage.getItem('atlas-language')==='zh'}catch(e){}
  var add=function(u,m){var l=d.createElement('link');if(m){l.rel='modulepreload';l.href=u}else{l.rel='preload';l.as='fetch';l.href=u;l.crossOrigin='anonymous'}d.head.appendChild(l)};
  ['./data/atlas.json','./data/land.json','./data/topic-taxonomy.json','./data/borders.json','./data/pipeline-summary.json'].forEach(function(u){add(u)});
  if(zh)add('./data/translations.zh.json');
  if(h==='home'){add('./data/starmap.json');add('./data/starmap-3d.json');add('./data/page-home.json');add('./home.js',1);add('./home-sky.js',1)}
  if(['evolution','foundations','opportunities','evidence','method','versions'].indexOf(h)>=0){add('./data/page-'+h+'.json');add('./paper.js',1)}
  if(['discover','findings'].indexOf(h)>=0){add('./data/findings.json');add('./lenses.js',1);add('./flags.js',1)}}catch(e){}})();</script>
